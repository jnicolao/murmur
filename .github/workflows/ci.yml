name: ci

# What runs here is everything a hosted runner can actually do. The crisis
# suites need Ollama and a 5 GB model, which a free runner cannot provide, so
# CI gates on the committed evidence instead: check_freshness.py fails the
# build when the committed safety result is older than the current classifier
# version or does not meet its thresholds. Run `make eval-safety` locally and
# commit the result before changing anything in safety/.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        working-directory: apps/api
        run: uv venv --python 3.12 && uv pip install -e ".[dev]"

      - name: Lint
        working-directory: apps/api
        run: .venv/bin/ruff check murmur tests ../../evals

      - name: Format
        working-directory: apps/api
        run: .venv/bin/ruff format --check murmur tests ../../evals

      - name: Phrase list and splitter
        working-directory: apps/api
        run: .venv/bin/pytest -q

      - name: Safety results are current
        run: apps/api/.venv/bin/python evals/check_freshness.py
