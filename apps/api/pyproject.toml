[project]
name = "murmur-api"
version = "0.1.0"
description = "Murmur voice loop API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "faster-whisper>=1.1",
    "kokoro>=0.9",
    "soundfile>=0.12",
    "numpy>=1.26",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.7", "websockets>=13.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The project is named murmur-api but the package directory is murmur, which
# hatchling's default heuristic cannot guess on its own.
[tool.hatch.build.targets.wheel]
packages = ["murmur"]
